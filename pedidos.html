
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pedidos | Brownie</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="js/apps.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/pedidos.js" defer></script>
</head>

<body>
  <div class="app-shell">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" style="
      background-image:
        linear-gradient(rgba(20, 15, 12, 0.55), rgba(20, 15, 12, 0.55)),
        url('img/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    ">

      <header class="topbar">
        <div style="display:flex;align-items:center;gap:13px">
          <button class="mobile-menu" id="menuToggle" aria-label="Abrir menu">☰</button>

          <div>
            <div class="topbar-title">Brownie · Pedidos</div>
            <div class="topbar-sub" id="todayLabel"></div>
          </div>
        </div>

        <div class="topbar-right">Painel de gerenciamento</div>
      </header>

      <div class="content">

        <div class="page-heading">
          <div>
            <h1>Pedidos</h1>
            <p>Consulte, filtre, atualize e acompanhe o histórico de pedidos.</p>
          </div>
        </div>

        <div class="toolbar">
          <input id="searchOrders" placeholder="Pesquisar por cliente ou número...">

          <select id="filterStatus">
            <option value="all">Todos os pedidos</option>
            <option value="pending">Pendentes</option>
            <option value="paid">Pagos</option>
            <option value="cancelled">Cancelados</option>
          </select>
        </div>

        <section class="card">
          <div class="table-wrap" id="ordersTable"></div>
        </section>

        <div class="modal-backdrop" id="orderModal">
          <div class="modal">

            <div class="modal-head">
              <h2 id="modalTitle">Detalhes do pedido</h2>
              <button class="close-btn" type="button" data-close>×</button>
            </div>

            <div id="orderDetails"></div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
