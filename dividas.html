
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dívidas em aberto | Brownie</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="js/apps.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/dividas.js" defer></script>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" style="
      background-image:
        linear-gradient(rgba(20, 15, 12, 0.55), rgba(20, 15, 12, 0.55)),
        url('img/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    ">

      <header class="topbar">
        <div style="display:flex;align-items:center;gap:13px">
          <button class="mobile-menu" id="menuToggle" aria-label="Abrir menu">☰</button>
          <div>
            <div class="topbar-title">Brownie · Dívidas em aberto</div>
            <div class="topbar-sub" id="todayLabel"></div>
          </div>
        </div>
        <div class="topbar-right">Painel de gerenciamento</div>
      </header>

      <div class="content">
        <div class="page-heading">
          <div>
            <h1>Dívidas em aberto</h1>
            <p>Pedidos ativos que ainda possuem saldo a receber.</p>
          </div>
        </div>

        <section class="stats-grid" id="debtStats"></section>

        <section class="card">
          <div class="table-wrap" id="debtsTable"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
